services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cripta_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - cripta_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      mailhog:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: cripta_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - cripta_network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: cripta_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cripta}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-cripta}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - cripta_mysql_data:/var/lib/mysql
    networks:
      - cripta_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD:-secret}"]
      retries: 5
      timeout: 5s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: cripta_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
      UPLOAD_LIMIT: 64M
    ports:
      - "${FORWARD_PMA_PORT:-8081}:80"
    networks:
      - cripta_network
    depends_on:
      mysql:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:latest
    container_name: cripta_mailhog
    restart: unless-stopped
    ports:
      - "${FORWARD_MAILHOG_SMTP_PORT:-1025}:1025"
      - "${FORWARD_MAILHOG_DASHBOARD_PORT:-8025}:8025"
    networks:
      - cripta_network

  redis:
    image: redis:7-alpine
    container_name: cripta_redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - cripta_redis_data:/data
    networks:
      - cripta_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      retries: 3
      timeout: 5s

networks:
  cripta_network:
    driver: bridge

volumes:
  cripta_mysql_data:
    driver: local
  cripta_redis_data:
    driver: local
